<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0b14">
<title>yaybooo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<style>
  :root{--bg:#0d0b14;--surface:#191426;--surface2:#221b36;--line:#2c2440;--ink:#f6f3ff;--muted:#a79dc4;
    --yay:#25e57e;--boo:#ff3b6b;}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{position:relative;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  #map{position:absolute;inset:0;z-index:0;background:#dfe3e8;}
  .leaflet-container{background:#dfe3e8;font-family:inherit;}
  .leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border-radius:12px;}
  .leaflet-popup-tip{background:var(--surface);}
  .leaflet-popup-content{margin:9px 12px;font-weight:700;font-size:13px;}
  .vibepin{width:26px;height:26px;border-radius:50% 50% 50% 3px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,.35);box-shadow:0 2px 6px rgba(0,0,0,.5);}
  .vibepin span{transform:rotate(-45deg);font-size:13px;}
  .sponpin{border-color:#8a6d1a!important;box-shadow:0 0 0 4px rgba(255,207,77,.35),0 2px 6px rgba(0,0,0,.5)!important;}

  .topbar{position:absolute;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;gap:12px;padding:12px 16px 22px;
    background:linear-gradient(180deg,rgba(13,11,20,.92),rgba(13,11,20,0));pointer-events:none;}
  .topbar>*{pointer-events:auto;}
  .logo{display:flex;align-items:center;gap:8px;}
  .mark{display:inline-flex;align-items:center;gap:1px;}
  .mark .u{color:var(--yay);display:inline-flex;} .mark .d{color:var(--boo);display:inline-flex;}
  .mark svg{width:21px;height:21px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
  .word{font-size:23px;font-weight:900;letter-spacing:-.04em;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
  .rules-link{font-size:13px;color:#fff;cursor:pointer;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .dl{font-size:13px;font-weight:800;color:#0d0b14;background:#fff;border:none;border-radius:999px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35);}
  .dl.soon{background:var(--surface2);color:var(--muted);}
  .dl svg{width:12px;height:12px;}

  .vibebtn{position:absolute;top:56px;left:12px;z-index:600;background:var(--ink);color:#0d0b14;border:none;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.45);}
  .vibebtn.on{background:#a97bff;color:#fff;}
  .vibehint{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:590;background:rgba(13,11,20,.85);color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:999px;display:none;pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);white-space:nowrap;}
  .vibehint.show{display:block;}
  .viberes{position:absolute;top:102px;left:12px;right:12px;z-index:610;background:rgba(13,11,20,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:none;}
  .viberes.show{display:block;}
  .vr-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .vr-emoji{font-size:20px;} .vr-label{font-size:15px;font-weight:900;} .vr-pct{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);}
  .vr-meter{height:8px;border-radius:999px;background:var(--boo);overflow:hidden;} .vr-meter span{display:block;height:100%;background:var(--yay);transition:width .3s;}
  .vr-top{margin-top:8px;font-size:12.5px;font-weight:800;color:#e6e1f5;} .vr-txt{font-size:13px;font-weight:700;color:var(--muted);}

  .mapfail{position:absolute;inset:0;z-index:400;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;line-height:1.5;}
  .mapfail.show{display:flex;}

  /* list panel floating on the map */
  .panel{position:absolute;left:0;right:0;bottom:0;z-index:600;height:33vh;height:33dvh;min-height:168px;
    background:rgba(13,11,20,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;display:flex;flex-direction:column;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4);}
  .grab{width:38px;height:4px;border-radius:999px;background:#4a4360;margin:2px auto 8px;flex:0 0 auto;}
  .phead{display:flex;align-items:center;gap:12px;padding:0 4px 8px;flex:0 0 auto;font-size:11px;font-weight:800;color:var(--muted);}
  .phead .lg{display:flex;align-items:center;gap:5px;}
  .phead .d{width:11px;height:11px;border-radius:50%;}
  .phead .d.y{background:radial-gradient(circle,var(--yay),rgba(37,229,126,0));}
  .phead .d.b{background:radial-gradient(circle,var(--boo),rgba(255,59,107,0));}
  .phead .d.s{background:radial-gradient(circle,#ffcf4d,rgba(255,207,77,0));}
  .phead .post{margin-left:auto;color:#cfc7e6;}
  .cols{flex:1;display:flex;min-height:0;gap:10px;}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;}
  .chead{display:flex;align-items:center;gap:7px;padding:0 2px 6px;flex:0 0 auto;}
  .chead .sym{display:inline-flex;}
  .col.yay .chead .sym{color:var(--yay);} .col.boo .chead .sym{color:var(--boo);}
  .chead .sym svg{width:18px;height:18px;display:block;}
  .chead .t{font-size:15px;font-weight:900;letter-spacing:-.03em;}
  .list{flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none;}
  .list::-webkit-scrollbar{display:none;}
  .row{position:relative;border-radius:12px;background:rgba(25,20,38,.9);overflow:hidden;display:flex;align-items:center;gap:9px;padding:10px 11px;cursor:pointer;transition:transform .07s;}
  .row:active{transform:scale(.98);}
  .bar{position:absolute;inset:0;width:0;transition:width .55s cubic-bezier(.2,.85,.3,1);}
  .col.yay .bar{background:rgba(37,229,126,.16);} .col.boo .bar{background:rgba(255,59,107,.16);}
  .rank{position:relative;width:16px;text-align:center;font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;flex:0 0 auto;color:var(--muted);}
  .col.yay .row.p1 .rank{color:var(--yay);} .col.boo .row.p1 .rank{color:var(--boo);}
  .word2{position:relative;flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
  .count{position:relative;font-size:13.5px;font-weight:900;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .col.yay .count{color:var(--yay);} .col.boo .count{color:var(--boo);}
  .empty{color:var(--muted);font-size:12px;padding:10px 4px;font-weight:600;}

  .toast{position:fixed;left:50%;bottom:38vh;transform:translateX(-50%);background:var(--ink);color:#0d0b14;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:800;opacity:0;transition:opacity .25s,bottom .25s;pointer-events:none;z-index:1200;}
  .toast.show{opacity:1;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1300;padding:20px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  .modal.open{display:flex;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;max-width:440px;width:100%;max-height:84vh;overflow-y:auto;padding:22px 22px 20px;}
  .card h2{font-size:22px;margin-bottom:3px;letter-spacing:-.03em;font-weight:900;}
  .card .lead{color:var(--muted);font-size:13px;margin-bottom:16px;font-weight:600;}
  .card ul{list-style:none;display:flex;flex-direction:column;gap:13px;margin-bottom:18px;}
  .card li{font-size:14px;line-height:1.5;padding-left:16px;position:relative;color:#d9d3ec;}
  .card li b{color:var(--ink);font-weight:800;}
  .card li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--yay);}
  .card .fine{color:var(--muted);font-size:11.5px;line-height:1.45;margin-bottom:18px;}
  .card .ok{width:100%;background:var(--yay);color:#0d0b14;border:none;border-radius:14px;font-size:16px;font-weight:900;padding:15px;cursor:pointer;}
  .rtabs{display:flex;gap:6px;margin-bottom:16px;}
  .rtab{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px;font-weight:800;font-size:12px;cursor:pointer;}
  .rtab.active{background:var(--yay);color:#0d0b14;border-color:var(--yay);}
  .card.vote{text-align:center;max-width:300px;}
  .vword{font-size:20px;font-weight:900;letter-spacing:-.02em;word-break:break-word;}
  .vcount{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:6px 0 22px;}
  .vbtns{display:flex;gap:18px;justify-content:center;margin-bottom:16px;}
  .vbtn{width:72px;height:72px;border-radius:22px;border:none;cursor:pointer;color:#0d0b14;display:flex;align-items:center;justify-content:center;transition:transform .08s,filter .12s;box-shadow:0 6px 0 0 rgba(0,0,0,.25);}
  .vbtn:active{transform:translateY(3px);box-shadow:0 3px 0 0 rgba(0,0,0,.25);}
  .vbtn svg{width:36px;height:36px;display:block;}
  .vbtn.up{background:var(--yay);} .vbtn.down{background:var(--boo);}
  .vbtn.locked{opacity:.3;pointer-events:none;filter:grayscale(1);box-shadow:none;}
  .vmsg{color:var(--muted);font-size:12.5px;margin-bottom:14px;min-height:16px;font-weight:600;}
  .vclose{background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;cursor:pointer;padding:6px 12px;}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="logo">
    <span class="mark"><span class="u" data-sym="y"></span><span class="d" data-sym="b"></span></span>
    <span class="word">yaybooo</span>
  </div>
  <div class="tb-right">
    <span class="rules-link" onclick="openRules()">Rules</span>
    <button class="dl" id="dlBtn"></button>
  </div>
</div>

<button class="vibebtn" id="vibebtn" onclick="toggleVibe()">◎ Check vibe</button>
<div class="vibehint" id="vibehint">Tap the map · pinch to resize</div>
<div class="viberes" id="viberes"></div>
<div class="mapfail" id="mapfail"></div>

<div class="panel">
  <div class="grab"></div>
  <div class="phead">
    <span class="lg"><span class="d y"></span> loved</span>
    <span class="lg"><span class="d b"></span> disliked</span>
    <span class="lg"><span class="d s"></span> sponsored</span>
    <span class="post">post in the app ↓</span>
  </div>
  <div class="cols">
    <div class="col yay">
      <div class="chead"><span class="sym" data-sym="y"></span><span class="t">top 10</span></div>
      <div class="list" id="listY"></div>
    </div>
    <div class="col boo">
      <div class="chead"><span class="sym" data-sym="b"></span><span class="t">flop 10</span></div>
      <div class="list" id="listB"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="card">
    <div class="rtabs">
      <button class="rtab active" id="tab-en" onclick="setLang('en')">EN</button>
      <button class="rtab" id="tab-sv" onclick="setLang('sv')">SV</button>
      <button class="rtab" id="tab-th" onclick="setLang('th')">TH</button>
    </div>
    <div id="rbody"></div>
    <button class="ok" id="rok" onclick="closeRules()">Got it</button>
  </div>
</div>

<div class="modal" id="voteModal">
  <div class="card vote">
    <div class="vword" id="voteWord"></div>
    <div class="vcount" id="voteCount">0</div>
    <div class="vbtns">
      <button class="vbtn up" id="voteUp" onclick="vote(1)"></button>
      <button class="vbtn down" id="voteDown" onclick="vote(-1)"></button>
    </div>
    <div class="vmsg" id="voteMsg"></div>
    <button class="vclose" onclick="closeVote()">Close</button>
  </div>
</div>

<script>
const PLAY_URL='';
const SVG_YAY=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="18" x2="17.5" y2="6.5"/><polyline points="9 6.5 17.5 6.5 17.5 15"/></svg>`;
const SVG_BOO=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5 C 9 6.5, 14.5 8.5, 16 16"/><polyline points="11.5 13.5 16 18 20.5 13.5"/></svg>`;
const SVG_PLAY=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3.5 L20 12 L4 20.5 Z"/></svg>`;

/* comment banks */
const SIM_Y=['Sunset 🔥','Cheap beer','Best pad thai','Live band','Happy hour','Beach vibe','Free wifi','Ice cold Chang','A hot chick passed 😏','Good tunes','Street food win','Mango sticky rice','Old man farting 💨','Monkey stole my condoms 🐒','Buffalo running 🐃','Drunk tourist face-plant 🍺','Guy in a mankini 🩲'];
const SIM_B=['Saw a dog shit 💩','Shitty road','Overpriced taxi','Seagull poop','Traffic chaos','Too crowded','Warm beer','Mosquito army','Long queue','Rain again ☔','Loud til 3am','Sunburned tourist','Elephant poo 🐘💩','Durian bomb 🤢','Guy peed on the wall'];
const WATER_Y=['Huge pike here 🎣','Big shark! 🦈','Huge clown fish 🐠','Dolphins! 🐬','Sea turtle 🐢','Fat grouper','Jumping fish','Crystal clear water'];
const WATER_B=['Jellyfish swarm 🪼','Trash in the sea','Oil slick','Dead fish 🐟','Murky water','Sea snake 🐍','Sharp coral'];
const OFFERS=['🍹 Happy hour — 2 for 1!','🛵 Scooter rental 200฿/day','🍔 Free fries w/ burger','💆 Massage 250฿','🎧 Live DJ tonight','🏍️ Bike wash 100฿'];

/* rules EN/SV/TH */
const RULES={
  en:{title:'Quick rules',lead:'Read it, takes 20 seconds.',ok:'Got it',items:[
    '<b>Map stuff and places — not named people.</b> Puke, crap, angry whistles: yep. Calling out actual people: nope, sorry. This is for gross, not slander.',
    '<b>Posts come from random people, not from this outfit.</b> A post means "someone reckoned something", not the truth — and people post drunk, so it gets messy. Use your head.',
    '<b>We don\u2019t sell your lame data, nobody wants it anyway.</b> Everything is wiped after a day, so the drunk posts vanish. Relax.',
    '<b>Spam and threats are out, behave.</b> We reserve the right to remove posts and ban misuse (of the app, that is).',
    '<b>You\u2019re responsible for what you write</b> — that\u2019s just how it is.'],
    fine:'By using yaybooo you accept this. The service is provided "as is" without warranties. Content is created by users and does not reflect our views.'},
  sv:{title:'Snabba regler',lead:'L\u00e4s, det tar 20 sekunder.',ok:'Jag fattar',items:[
    '<b>Kartl\u00e4gg grejer och platser \u2013 inte namngivna personer.</b> Spyor, skit, arga visselpipor: japp. Utpekade personer: nej, tyv\u00e4rr inte. Sidan vill ha \u00e4ckel, inte f\u00f6rtal.',
    '<b>Inl\u00e4ggen kommer fr\u00e5n vanligt folk, inte fr\u00e5n denna koncern.</b> Ett inl\u00e4gg betyder "n\u00e5gon tyckte n\u00e5got", inte sanning \u2013 och folk kan skriva p\u00e5 fyllan, d\u00e5 blir det snurrigt. Anv\u00e4nd huvudet.',
    '<b>Vi s\u00e4ljer inte din t\u00f6ntiga data, ingen vill ha den \u00e4nd\u00e5.</b> Skiten raderas efter ett dygn s\u00e5 fylleinl\u00e4ggen f\u00f6rsvinner. K\u00e4nn lugnet.',
    '<b>Skr\u00e4p och hot \u00e5ker ut, vet hut.</b> Vi f\u00f6rbeh\u00e5ller oss r\u00e4tten att ta bort inl\u00e4gg och st\u00e4nga av vid missbruk (av appen allts\u00e5).',
    '<b>Du ansvarar f\u00f6r det du skriver</b> \u2013 och s\u00e5 \u00e4r det.'],
    fine:'Genom att anv\u00e4nda yaybooo godk\u00e4nner du det h\u00e4r. Tj\u00e4nsten tillhandah\u00e5lls "i befintligt skick" utan garantier. Inneh\u00e5ll skapas av anv\u00e4ndare och speglar inte v\u00e5ra \u00e5sikter.'},
  th:{title:'กฎแบบเร็ว ๆ',lead:'อ่านหน่อย ใช้เวลาแค่ 20 วินาที',ok:'เข้าใจแล้ว',items:[
    '<b>ปักหมุดสิ่งของและสถานที่ ไม่ใช่บุคคลที่ระบุตัวตน</b> อ้วก ขี้ นกหวีดโกรธ ๆ ได้เลย แต่การพาดพิงถึงบุคคลจริง ไม่ได้ ขอโทษด้วย ที่นี่สำหรับเรื่องน่าขยะแขยง ไม่ใช่การหมิ่นประมาท',
    '<b>โพสต์มาจากคนทั่วไป ไม่ใช่จากเรา</b> โพสต์หมายถึง "มีคนคิดแบบนั้น" ไม่ใช่ความจริง และบางคนโพสต์ตอนเมา มันเลยอาจมั่ว ใช้วิจารณญาณ',
    '<b>เราไม่ขายข้อมูลของคุณ ไม่มีใครอยากได้อยู่แล้ว</b> ทุกอย่างจะถูกลบหลังหนึ่งวัน โพสต์ตอนเมาก็จะหายไป สบายใจได้',
    '<b>สแปมและการข่มขู่จะถูกลบ</b> เราขอสงวนสิทธิ์ในการลบโพสต์และระงับการใช้งานที่ผิดวัตถุประสงค์ (ของแอป)',
    '<b>คุณรับผิดชอบสิ่งที่คุณเขียนเอง</b> ก็แค่นั้นแหละ'],
    fine:'เมื่อใช้ yaybooo ถือว่าคุณยอมรับข้อกำหนดนี้ บริการให้ "ตามสภาพ" โดยไม่มีการรับประกัน เนื้อหาสร้างโดยผู้ใช้และไม่ได้สะท้อนความคิดเห็นของเรา'}
};
function setLang(l){const r=RULES[l];
  document.getElementById('rbody').innerHTML='<h2>'+r.title+'</h2><div class="lead">'+r.lead+'</div><ul>'+r.items.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="fine">'+r.fine+'</div>';
  document.getElementById('rok').textContent=r.ok;
  ['en','sv','th'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===l));}

/* top/flop lists (like/dislike only) */
let yay=[{w:'Robban å Willes beteende',n:10},{w:'Kinesiska boxare',n:9},{w:'KristetGS',n:8},{w:'Central fashion show',n:7},{w:'Dinosaur exploring',n:6},{w:'Sang Som off the rocks',n:5},{w:'Kioskes',n:4},{w:'Dubai golf cart adventure',n:3},{w:'DG breaks',n:2},{w:'Smart falang',n:1}];
let boo=[{w:'Stone table expert',n:10},{w:'Singha shirt',n:9},{w:'Fish with beard',n:8},{w:'Such a robber',n:7},{w:'Cute Indian daeng',n:6},{w:'Dr Helmut',n:5},{w:'Soi6',n:4},{w:'Walking',n:3},{w:'Stupid falang',n:2},{w:'Tao',n:1}];
const voted=new Set();
function vkey(side,word){return side+'|'+word.toLowerCase();}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1400);}
function render(side){
  const arr=(side==='y'?yay:boo).slice().sort((a,b)=>b.n-a.n).slice(0,10);
  const max=arr.length?arr[0].n:1;
  const el=document.getElementById(side==='y'?'listY':'listB');el.innerHTML='';
  if(!arr.length){el.innerHTML='<div class="empty">no posts yet</div>';return;}
  arr.forEach((item,i)=>{
    const row=document.createElement('div');row.className='row'+(i===0?' p1':'');
    row.innerHTML='<span class="bar"></span><span class="rank">'+(i+1)+'</span><span class="word2">'+esc(item.w)+'</span><span class="count">'+item.n+'</span>';
    row.style.cursor='pointer';row.onclick=()=>openVote(side,item.w);
    el.appendChild(row);
    requestAnimationFrame(()=>{row.querySelector('.bar').style.width=(item.n/max*100)+'%';});
  });
}
function openRules(){document.getElementById('modal').classList.add('open');}
function closeRules(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeRules();});

/* voting (list rows + map pins) */
let voteRef=null;
function showVote(item,side,key,isList){voteRef={item,side,key,isList};
  document.getElementById('voteWord').textContent=item.w;
  document.getElementById('voteCount').textContent=item.n;
  lockUI(voted.has(key));document.getElementById('voteModal').classList.add('open');}
function openVote(side,word){const arr=side==='y'?yay:boo;const it=arr.find(x=>x.w.toLowerCase()===word.toLowerCase());if(!it)return;showVote(it,side,vkey(side,it.w),true);}
function openPin(item,side){showVote(item,side,'pin|'+item.id,false);}
function lockUI(locked){document.getElementById('voteUp').classList.toggle('locked',locked);document.getElementById('voteDown').classList.toggle('locked',locked);document.getElementById('voteMsg').textContent=locked?'you already voted on this':'';}
function vote(delta){
  if(!voteRef)return;if(voted.has(voteRef.key))return;
  voteRef.item.n+=delta;voted.add(voteRef.key);
  if(voteRef.isList && voteRef.item.n<=0){const arr=voteRef.side==='y'?yay:boo;const i=arr.indexOf(voteRef.item);if(i>=0)arr.splice(i,1);render(voteRef.side);closeVote();toast('removed');return;}
  if(voteRef.item.n<0)voteRef.item.n=0;
  document.getElementById('voteCount').textContent=voteRef.item.n;lockUI(true);
  if(voteRef.isList)render(voteRef.side);
}
function closeVote(){document.getElementById('voteModal').classList.remove('open');voteRef=null;}
document.getElementById('voteModal').addEventListener('click',e=>{if(e.target.id==='voteModal')closeVote();});

function wireDl(el){if(!el)return;if(PLAY_URL){el.innerHTML=SVG_PLAY+' Download';el.onclick=()=>window.open(PLAY_URL,'_blank');}else{el.innerHTML=SVG_PLAY+' Coming soon to Google Play';el.classList.add('soon');el.onclick=()=>toast('app coming soon');}}

/* ---- run lists + ui first (always work even if map fails) ---- */
setLang('en');
document.querySelectorAll('[data-sym="y"]').forEach(e=>e.innerHTML=SVG_YAY);
document.querySelectorAll('[data-sym="b"]').forEach(e=>e.innerHTML=SVG_BOO);
document.getElementById('voteUp').innerHTML=SVG_YAY;
document.getElementById('voteDown').innerHTML=SVG_BOO;
wireDl(document.getElementById('dlBtn'));
render('y');render('b');

/* ---------- MAP ---------- */
const CENTER=[12.9320,100.8850];
let map=null,liveLayer=null,areaLayer=null,sponsorLayer=null;let heatLayers=[];const livePins=[];const allPins=[];
function mapFail(msg){const f=document.getElementById('mapfail');f.textContent=msg;f.classList.add('show');}
function pinIcon(t){return L.divIcon({className:'',iconSize:[26,26],iconAnchor:[6,26],html:'<div class="vibepin" style="background:'+(t==='y'?'#25e57e':'#ff3b6b')+'"><span>'+(t==='y'?'\uD83D\uDE00':'\uD83D\uDE21')+'</span></div>'});}
function sponsorIcon(){return L.divIcon({className:'',iconSize:[28,28],iconAnchor:[7,28],html:'<div class="vibepin sponpin" style="background:#ffcf4d"><span>\uD83D\uDCE3</span></div>'});}
function viewSpan(){try{const b=map.getBounds();return b.getNorth()-b.getSouth();}catch(e){return 0.01;}}
function randInView(){const c=map.getCenter(),s=viewSpan();return [c.lat+(Math.random()-.5)*s*.7,c.lng+(Math.random()-.5)*s*.7];}

/* water check via tile pixel colour */
const tileCache={};
function isWaterAt(lat,lng,cb){try{
  if(!map){cb(false);return;}
  const z=Math.min(map.getZoom(),18),n=Math.pow(2,z);
  const xf=(lng+180)/360*n,yf=(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n;
  const xt=Math.floor(xf),yt=Math.floor(yf),px=Math.floor((xf-xt)*256),py=Math.floor((yf-yt)*256);
  const sample=img=>{try{const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d');g.drawImage(img,0,0);const d=g.getImageData(px,py,1,1).data;cb(Math.abs(d[0]-170)<40&&Math.abs(d[1]-211)<34&&Math.abs(d[2]-223)<34&&d[2]>=d[0]);}catch(e){cb(false);}};
  const key=z+'/'+xt+'/'+yt,cc=tileCache[key];
  if(cc){cc.complete?sample(cc):cc.addEventListener('load',()=>sample(cc));return;}
  const img=new Image();img.crossOrigin='anonymous';tileCache[key]=img;img.onload=()=>sample(img);img.onerror=()=>cb(false);
  img.src='https://'+'abc'[Math.floor(Math.random()*3)]+'.tile.openstreetmap.org/'+z+'/'+xt+'/'+yt+'.png';
}catch(e){cb(false);}}

/* live pins */
function dropPin(p,side,w){
  if(!map||!liveLayer)return;
  const item={id:'L'+Date.now()+Math.floor(Math.random()*1000),w:w,n:1};
  const m=L.marker(p,{icon:pinIcon(side)}).addTo(liveLayer).on('click',()=>openPin(item,side));
  const entry={lat:p[0],lng:p[1],side,item};allPins.push(entry);livePins.push({m,entry});
  if(livePins.length>12){const old=livePins.shift();liveLayer.removeLayer(old.m);const i=allPins.indexOf(old.entry);if(i>=0)allPins.splice(i,1);}
  if(vibeMode&&vibeCircle)computeVibe();
}

/* area mood: colour driven by yay vs boo, follows the view */
function refreshArea(){
  if(!map)return;
  if(!areaLayer)areaLayer=L.layerGroup().addTo(map);else areaLayer.clearLayers();
  for(let i=allPins.length-1;i>=0;i--) if(allPins[i].area) allPins.splice(i,1);
  const c=map.getCenter(),span=viewSpan(),yPts=[],bPts=[];
  const clusters=3+Math.floor(Math.random()*3);
  for(let k=0;k<clusters;k++){
    const clat=c.lat+(Math.random()-.5)*span*.62, clng=c.lng+(Math.random()-.5)*span*.62;
    const yayLean=Math.random()<0.5, cnt=4+Math.floor(Math.random()*5);
    for(let j=0;j<cnt;j++){
      const la=clat+(Math.random()-.5)*span*.14, ln=clng+(Math.random()-.5)*span*.14;
      const side=Math.random()<(yayLean?0.82:0.18)?'y':'b';
      const bank=side==='y'?SIM_Y:SIM_B;
      const item={id:'a'+Math.random().toString(36).slice(2),w:bank[Math.floor(Math.random()*bank.length)],n:2+Math.floor(Math.random()*9)};
      allPins.push({lat:la,lng:ln,side,item,area:true});
      L.marker([la,ln],{icon:pinIcon(side)}).addTo(areaLayer).on('click',()=>openPin(item,side));
      (side==='y'?yPts:bPts).push([la,ln,Math.min(1,item.n/10)]);
      (function(it,sd,a,b){isWaterAt(a,b,water=>{if(water){const wb=sd==='y'?WATER_Y:WATER_B;it.w=wb[Math.floor(Math.random()*wb.length)];}});})(item,side,la,ln);
    }
  }
  heatLayers.forEach(h=>map.removeLayer(h));heatLayers=[];
  if(L.heatLayer){
    if(yPts.length)heatLayers.push(L.heatLayer(yPts,{radius:52,blur:44,minOpacity:.2,gradient:{0.1:'rgba(37,229,126,0.10)',0.5:'rgba(37,229,126,0.4)',1:'rgba(37,229,126,0.72)'}}).addTo(map));
    if(bPts.length)heatLayers.push(L.heatLayer(bPts,{radius:52,blur:44,minOpacity:.2,gradient:{0.1:'rgba(255,59,107,0.10)',0.5:'rgba(255,59,107,0.4)',1:'rgba(255,59,107,0.72)'}}).addTo(map));
  }
  if(vibeMode&&vibeCircle)computeVibe();
}
function refreshSponsors(){
  if(!map)return;
  if(!sponsorLayer)sponsorLayer=L.layerGroup().addTo(map);else sponsorLayer.clearLayers();
  for(let i=0;i<2;i++){const p=randInView();L.marker(p,{icon:sponsorIcon()}).addTo(sponsorLayer).bindPopup('⭐ SPONSORED<br>'+OFFERS[Math.floor(Math.random()*OFFERS.length)]);}
}

/* Check vibe */
let vibeMode=false,vibeCircle=null,vibeRadius=300,lastPinch=null;
function hav(a,b,c,d){const R=6371000,r=Math.PI/180,dphi=(c-a)*r,dl=(d-b)*r;const x=Math.sin(dphi/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function toggleVibe(){vibeMode=!vibeMode;
  document.getElementById('vibebtn').classList.toggle('on',vibeMode);
  document.getElementById('vibehint').classList.toggle('show',vibeMode);
  if(map){if(vibeMode){map.scrollWheelZoom.disable();map.doubleClickZoom.disable();map.touchZoom.disable();}else{map.scrollWheelZoom.enable();map.doubleClickZoom.enable();map.touchZoom.enable();clearVibe();}}}
function clearVibe(){if(vibeCircle&&map){map.removeLayer(vibeCircle);vibeCircle=null;}document.getElementById('viberes').classList.remove('show');}
function placeVibe(latlng){if(!map)return;if(!vibeCircle)vibeCircle=L.circle(latlng,{radius:vibeRadius,color:'#a97bff',weight:2,fillColor:'#a97bff',fillOpacity:.12}).addTo(map);else vibeCircle.setLatLng(latlng).setRadius(vibeRadius);computeVibe();}
function computeVibe(){
  if(!vibeCircle)return;
  const c=vibeCircle.getLatLng();let y=0,b=0;const inside=[];
  allPins.forEach(p=>{if(hav(c.lat,c.lng,p.lat,p.lng)<=vibeRadius){if(p.side==='y')y+=p.item.n;else b+=p.item.n;inside.push(p);}});
  const el=document.getElementById('viberes');el.classList.add('show');
  const tot=y+b;
  if(!tot){el.innerHTML='<div class="vr-txt">No reactions in this circle yet — try a bigger area</div>';return;}
  const ratio=y/tot,pct=Math.round(ratio*100);let emoji,label,col;
  if(ratio>=0.66){emoji='😀';label='Great vibe';col='var(--yay)';}else if(ratio>=0.4){emoji='😐';label='Mixed';col='#ffcf4d';}else{emoji='😡';label='Avoid';col='var(--boo)';}
  const top=inside.slice().sort((a,z)=>z.item.n-a.item.n)[0];
  el.innerHTML='<div class="vr-head"><span class="vr-emoji">'+emoji+'</span><span class="vr-label" style="color:'+col+'">'+label+'</span><span class="vr-pct">'+pct+'% yay</span></div><div class="vr-meter"><span style="width:'+pct+'%"></span></div>'+(top?'<div class="vr-top">🔥 Top: '+esc(top.item.w)+'</div>':'');
}

function initMap(){
  if(typeof L==='undefined'){mapFail('Map could not load — check your connection and reopen.');return;}
  try{
    map=L.map('map',{zoomControl:false,attributionControl:true}).setView(CENTER,15);
    L.control.zoom({position:'topright'}).addTo(map);
    const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
    tiles.addTo(map);
    let warned=false;tiles.on('tileerror',()=>{if(!warned){warned=true;mapFail('Map tiles could not load (offline?). The lists still work.');}});
    liveLayer=L.layerGroup().addTo(map);
    try{refreshArea();}catch(e){}
    refreshSponsors();
    let moveT=null;map.on('moveend',()=>{clearTimeout(moveT);moveT=setTimeout(()=>{try{refreshArea();}catch(e){}refreshSponsors();},250);});
    map.on('click',e=>{if(vibeMode)placeVibe(e.latlng);});
    const cont=map.getContainer(),tdist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    cont.addEventListener('touchstart',e=>{if(vibeMode&&vibeCircle&&e.touches.length===2)lastPinch=tdist(e.touches);},{passive:false});
    cont.addEventListener('touchmove',e=>{if(!vibeMode||!vibeCircle||e.touches.length!==2)return;e.preventDefault();const d=tdist(e.touches);if(lastPinch){vibeRadius=Math.max(50,Math.min(5000,vibeRadius*(d/lastPinch)));vibeCircle.setRadius(vibeRadius);computeVibe();}lastPinch=d;},{passive:false});
    cont.addEventListener('touchend',e=>{if(e.touches.length<2)lastPinch=null;});
    cont.addEventListener('wheel',e=>{if(!vibeMode||!vibeCircle)return;e.preventDefault();vibeRadius=Math.max(50,Math.min(5000,vibeRadius*(e.deltaY>0?0.9:1.1)));vibeCircle.setRadius(vibeRadius);computeVibe();},{passive:false});
    setTimeout(()=>map.invalidateSize(),250);
  }catch(e){mapFail('Map could not start — but the lists work.');}
}
window.addEventListener('load',initMap);

/* live stream */
const SIM=true;
function reaction(side,w){const arr=side==='y'?yay:boo;const bump=2+Math.floor(Math.random()*5);const hit=arr.find(x=>x.w.toLowerCase()===w.toLowerCase());if(hit)hit.n+=bump;else arr.push({w,n:4+Math.floor(Math.random()*6)});render(side);toast((side==='y'?'😀 ':'😡 ')+w);}
function simTick(){
  if(!SIM)return;
  const side=Math.random()<0.5?'y':'b';
  if(!map){const b=side==='y'?SIM_Y:SIM_B;reaction(side,b[Math.floor(Math.random()*b.length)]);return;}
  const p=randInView();
  isWaterAt(p[0],p[1],water=>{const bank=water?(side==='y'?WATER_Y:WATER_B):(side==='y'?SIM_Y:SIM_B);const w=bank[Math.floor(Math.random()*bank.length)];dropPin(p,side,w);reaction(side,w);});
}
setInterval(simTick,6000);
</script>
